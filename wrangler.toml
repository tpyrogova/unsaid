name = "unsaid"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "unsaid"
database_id = "23176b01-8ae2-4ff9-abb5-6958c55ac83a"
migrations_dir = "migrations"

# Workers AI (Qwen). Always runs on Cloudflare, also during local dev,
# so `wrangler login` is required. No API key needed.
[ai]
binding = "AI"
