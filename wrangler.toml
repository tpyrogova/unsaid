name = "unsaid"
main = "server/worker.ts"
compatibility_date = "2026-10-01"

# The built SPA. Cloudflare serves these files directly (free, no Worker
# invocation); only /api/* runs the Worker.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "unsaid"
database_id = "23176b01-8ae2-4ff9-abb5-6958c55ac83a"
migrations_dir = "migrations"

# Workers AI (Qwen). Always runs on Cloudflare, also during local dev,
# so `wrangler login` is required. No API key needed.
[ai]
binding = "AI"
remote = true
