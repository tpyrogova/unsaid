name = "unsaid"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "unsaid"
# Replace with the id from `wrangler d1 create unsaid` before deploying.
# Local development (`--local`) works with any value.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Workers AI (Qwen). Always runs on Cloudflare, also during local dev,
# so `wrangler login` is required. No API key needed.
[ai]
binding = "AI"
